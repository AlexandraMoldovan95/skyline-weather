# Runs the unit tests for logic.js (weather card values, wind direction, escaping, the request
# URL, error messages, demo data) on every push and pull request. Plain Node, no packages, no API key.
name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "tests/*.test.js"
