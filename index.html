<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skyline — Weather App with your own API key</title>
<meta name="description" content="Skyline shows you real-time weather using your own OpenWeatherMap API key — no account, no middleman server, your data stays in your browser.">

<!-- Open Graph / preview for sharing the link -->

<meta property="og:description" content="Your weather, straight from OpenWeatherMap. Uses your own API key — no middleman server.">
<meta property="og:image" content="https://skyline-weatherapp-c67411.netlify.app/og-preview.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://skyline-weatherapp-c67411.netlify.app/">
<meta property="og:site_name" content="Skyline Weather">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Skyline — Weather">
<meta name="twitter:description" content="Your weather, straight from OpenWeatherMap.">
<meta name="twitter:image" content="https://skyline-weatherapp-c67411.netlify.app/og-preview.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================
   TOKENS
   ============================================ */
:root {
  /* Midday-to-sunset sky — base palette */
  --sky-top: #2B6CB0;      /* zenith blue */
  --sky-mid: #6FA8DC;      /* mid blue */
  --sky-horizon: #FDE9C8;  /* warm horizon light */
  --sun-glow: #FFD98A;

  --ink-900: #10233E;      /* main text, near-black blue */
  --ink-600: #3E5878;      /* secondary text */
  --ink-400: #7B93AD;      /* tertiary text / placeholder */

  --glass-fill: rgba(255, 255, 255, 0.34);
  --glass-fill-strong: rgba(255, 255, 255, 0.55);
  --glass-border: rgba(255, 255, 255, 0.6);
  --glass-shadow: rgba(16, 35, 62, 0.25);

  --accent: #F2994A;       /* sunset orange, used sparingly */
  --error: #C0392B;

  --font-display: 'Space Grotesk', sans-serif;
  --font-body: 'Inter', sans-serif;

  --radius-lg: 28px;
  --radius-md: 14px;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: var(--font-body);
  color: var(--ink-900);
}

body {
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* ============================================
   ANIMATED BACKGROUND SKY
   ============================================ */
.sky {
  position: fixed;
  inset: 0;
  z-index: -1;
  background: linear-gradient(
    180deg,
    var(--sky-top) 0%,
    var(--sky-mid) 55%,
    var(--sky-horizon) 100%
  );
  overflow: hidden;
}

.sun {
  position: absolute;
  top: 12%;
  right: 15%;
  width: 180px;
  height: 180px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--sun-glow) 0%, rgba(255, 217, 138, 0) 70%);
  filter: blur(2px);
  animation: pulse-glow 6s ease-in-out infinite;
}

@keyframes pulse-glow {
  0%, 100% { transform: scale(1); opacity: 0.9; }
  50% { transform: scale(1.12); opacity: 1; }
}

.cloud {
  position: absolute;
  background: rgba(255, 255, 255, 0.5);
  border-radius: 100px;
  filter: blur(1px);
}

.cloud::before,
.cloud::after {
  content: '';
  position: absolute;
  background: inherit;
  border-radius: 50%;
}

.cloud--1 {
  width: 200px;
  height: 60px;
  top: 20%;
  left: -220px;
  animation: drift 42s linear infinite;
}
.cloud--1::before { width: 90px; height: 90px; top: -45px; left: 20px; }
.cloud--1::after { width: 70px; height: 70px; top: -30px; left: 100px; }

.cloud--2 {
  width: 140px;
  height: 44px;
  top: 55%;
  left: -160px;
  opacity: 0.7;
  animation: drift 58s linear infinite;
  animation-delay: -20s;
}
.cloud--2::before { width: 60px; height: 60px; top: -28px; left: 15px; }
.cloud--2::after { width: 50px; height: 50px; top: -20px; left: 70px; }

.cloud--3 {
  width: 170px;
  height: 50px;
  top: 75%;
  left: -200px;
  opacity: 0.55;
  animation: drift 50s linear infinite;
  animation-delay: -10s;
}
.cloud--3::before { width: 70px; height: 70px; top: -35px; left: 18px; }
.cloud--3::after { width: 55px; height: 55px; top: -24px; left: 85px; }

@keyframes drift {
  from { transform: translateX(0); }
  to { transform: translateX(calc(100vw + 400px)); }
}

@media (prefers-reduced-motion: reduce) {
  .sun, .cloud--1, .cloud--2, .cloud--3 {
    animation: none;
  }
}

/* ============================================
   GENERAL LAYOUT
   ============================================ */
.screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.screen--hidden {
  display: none;
}

/* ============================================
   GLASS CARD (GLASSMORPHISM)
   ============================================ */
.card {
  width: 100%;
  max-width: 440px;
  padding: 40px 36px 36px;
  background: var(--glass-fill);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  backdrop-filter: blur(22px) saturate(160%);
  -webkit-backdrop-filter: blur(22px) saturate(160%);
  box-shadow:
    0 24px 60px -12px var(--glass-shadow),
    inset 0 1px 0 rgba(255, 255, 255, 0.8);
}

.card__eyebrow {
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-600);
  margin-bottom: 10px;
}

.card__title {
  font-family: var(--font-display);
  font-size: 30px;
  font-weight: 700;
  line-height: 1.15;
  margin: 0 0 12px;
  color: var(--ink-900);
}

.card__subtitle {
  font-size: 14.5px;
  line-height: 1.55;
  color: var(--ink-600);
  margin: 0 0 28px;
}

.card__subtitle strong {
  color: var(--ink-900);
}

/* ============================================
   FORMULAR
   ============================================ */
.form {
  display: flex;
  flex-direction: column;
  position: relative;
}

.form__label {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-900);
  margin-bottom: 8px;
}

.form__input {
  width: 100%;
  padding: 14px 46px 14px 16px;
  font-family: var(--font-body);
  font-size: 15px;
  color: var(--ink-900);
  background: rgba(255, 255, 255, 0.55);
  border: 1.5px solid rgba(255, 255, 255, 0.8);
  border-radius: var(--radius-md);
  outline: none;
  transition: border-color 0.2s ease, background 0.2s ease;
}

.form__input::placeholder {
  color: var(--ink-400);
  font-size: 13px;
}

.form__input:focus {
  border-color: var(--accent);
  background: rgba(255, 255, 255, 0.75);
}

.form__input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.form__input.is-invalid {
  border-color: var(--error);
}

.form__toggle {
  position: absolute;
  right: 12px;
  top: 38px;
  width: 32px;
  height: 32px;
  border: none;
  background: transparent;
  cursor: pointer;
  font-size: 16px;
  opacity: 0.6;
  transition: opacity 0.2s ease;
}

.form__toggle:hover {
  opacity: 1;
}

.form__error {
  min-height: 18px;
  margin: 8px 0 0;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--error);
}

/* ============================================
   BUTOANE
   ============================================ */
.btn {
  font-family: var(--font-body);
  font-size: 15px;
  font-weight: 600;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  border: none;
}

.btn--primary {
  margin-top: 18px;
  padding: 15px;
  color: #fff;
  background: linear-gradient(135deg, var(--accent), #E07B3E);
  box-shadow: 0 12px 24px -8px rgba(242, 153, 74, 0.6);
}

.btn--primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 16px 28px -8px rgba(242, 153, 74, 0.7);
}

.btn--primary:active {
  transform: translateY(0);
}

.btn--ghost {
  padding: 9px 16px;
  font-size: 13px;
  color: var(--ink-900);
  background: var(--glass-fill-strong);
  border: 1px solid var(--glass-border);
}

.btn--ghost:hover {
  background: rgba(255, 255, 255, 0.7);
}

.form__hint-link {
  margin-top: 18px;
  text-align: center;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-600);
  text-decoration: none;
}

.form__hint-link:hover {
  color: var(--accent);
  text-decoration: underline;
}

/* ============================================
   MAIN APP SCREEN (Step 2+)
   ============================================ */
.app-header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 32px;
  z-index: 10;
}

.app-header__brand {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
  color: var(--ink-900);
}

.app-container {
  width: 100%;
  max-width: 560px;
  margin-top: 40px;
}

/* ============================================
   SEARCH FORM (Step 2)
   ============================================ */
.search-card {
  padding: 28px;
  background: var(--glass-fill);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  backdrop-filter: blur(22px) saturate(160%);
  -webkit-backdrop-filter: blur(22px) saturate(160%);
  box-shadow:
    0 24px 60px -12px var(--glass-shadow),
    inset 0 1px 0 rgba(255, 255, 255, 0.8);
}

.search-form {
  display: flex;
  gap: 12px;
  align-items: flex-end;
  flex-wrap: wrap;
}

.search-field {
  display: flex;
  flex-direction: column;
  flex: 1 1 auto;
  min-width: 160px;
}

.search-field--country {
  flex: 0 1 130px;
  min-width: 110px;
}

.search-field__label {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--ink-900);
  margin-bottom: 7px;
}

.search-field__input,
.search-field__select {
  width: 100%;
  padding: 13px 14px;
  font-family: var(--font-body);
  font-size: 14.5px;
  color: var(--ink-900);
  background: rgba(255, 255, 255, 0.55);
  border: 1.5px solid rgba(255, 255, 255, 0.8);
  border-radius: var(--radius-md);
  outline: none;
  transition: border-color 0.2s ease, background 0.2s ease;
  appearance: none;
}

.search-field__select {
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%233E5878'/></svg>");
  background-repeat: no-repeat;
  background-position: right 14px center;
  padding-right: 32px;
  cursor: pointer;
}

.search-field__input::placeholder {
  color: var(--ink-400);
  font-size: 13.5px;
}

.search-field__input:focus,
.search-field__select:focus {
  border-color: var(--accent);
  background: rgba(255, 255, 255, 0.75);
}

.search-field__input:focus-visible,
.search-field__select:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.search-field__input.is-invalid {
  border-color: var(--error);
}

.search-form__error {
  flex-basis: 100%;
  min-height: 0;
  margin: 0;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--error);
}

.btn--search {
  flex: 0 0 auto;
  height: 46px;
  padding: 0 22px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: #fff;
  background: linear-gradient(135deg, var(--accent), #E07B3E);
  box-shadow: 0 12px 24px -8px rgba(242, 153, 74, 0.6);
}

.btn--search:hover {
  transform: translateY(-1px);
  box-shadow: 0 16px 28px -8px rgba(242, 153, 74, 0.7);
}

.btn--search svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}

/* ============================================
   RESULTS AREA / LOADING STATE
   ============================================ */
.results {
  margin-top: 24px;
}

.results--empty {
  display: none;
}

.loading-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  padding: 48px 24px;
  color: var(--ink-600);
  font-size: 14px;
  font-weight: 500;
}

.spinner {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 3px solid rgba(255, 255, 255, 0.5);
  border-top-color: var(--accent);
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@media (prefers-reduced-motion: reduce) {
  .spinner {
    animation: none;
  }
}

/* ============================================
   ERROR STATE IN RESULTS
   ============================================ */
.result-error {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  padding: 40px 28px;
  text-align: center;
  background: var(--glass-fill);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  backdrop-filter: blur(22px) saturate(160%);
  -webkit-backdrop-filter: blur(22px) saturate(160%);
  animation: fade-in-up 0.35s ease both;
}

.result-error__icon {
  font-size: 26px;
}

.result-error__message {
  font-size: 14.5px;
  font-weight: 500;
  color: var(--ink-900);
  max-width: 340px;
}

.result-error__action {
  margin-top: 4px;
  padding: 10px 20px;
  font-size: 13.5px;
}

/* ============================================
   WEATHER CARD
   ============================================ */
.weather-card {
  padding: 32px;
  background: var(--glass-fill);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  backdrop-filter: blur(22px) saturate(160%);
  -webkit-backdrop-filter: blur(22px) saturate(160%);
  box-shadow:
    0 24px 60px -12px var(--glass-shadow),
    inset 0 1px 0 rgba(255, 255, 255, 0.8);
  animation: fade-in-up 0.4s ease both;
}

@keyframes fade-in-up {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (prefers-reduced-motion: reduce) {
  .weather-card,
  .result-error {
    animation: none;
  }
}

.weather-card__location {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--ink-600);
  margin: 0 0 4px;
}

.weather-card__main {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 24px;
}

.weather-card__temp-block {
  display: flex;
  flex-direction: column;
}

.weather-card__temp {
  font-family: var(--font-display);
  font-size: 64px;
  font-weight: 700;
  line-height: 1;
  color: var(--ink-900);
}

.weather-card__desc {
  margin-top: 6px;
  font-size: 15px;
  font-weight: 500;
  color: var(--ink-600);
  text-transform: capitalize;
}

.weather-card__icon {
  width: 96px;
  height: 96px;
  flex-shrink: 0;
  filter: drop-shadow(0 8px 16px rgba(16, 35, 62, 0.15));
}

.weather-card__grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.weather-stat {
  padding: 14px 16px;
  background: rgba(255, 255, 255, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.6);
  border-radius: var(--radius-md);
}

.weather-stat__label {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--ink-400);
  margin-bottom: 4px;
}

.weather-stat__value {
  font-size: 17px;
  font-weight: 600;
  color: var(--ink-900);
}

.weather-stat__value strong {
  font-weight: 700;
}

/* ============================================
   DISABLED BUTTON WHILE LOADING
   ============================================ */
.btn--search:disabled {
  opacity: 0.7;
  cursor: not-allowed;
  transform: none;
}

.btn--search:disabled:hover {
  transform: none;
}

/* ============================================
   RESPONSIVE
   ============================================ */
@media (max-width: 480px) {
  .card {
    padding: 32px 24px 28px;
  }

  .card__title {
    font-size: 26px;
  }

  .app-header {
    padding: 16px 20px;
  }

  .search-form {
    flex-direction: column;
    align-items: stretch;
  }

  .search-field--country {
    flex-basis: auto;
  }

  .btn--search {
    width: 100%;
    justify-content: center;
  }

  .weather-card__temp {
    font-size: 52px;
  }

  .weather-card__icon {
    width: 76px;
    height: 76px;
  }
}
</style>
</head>
<body>

  <!-- Animated background sky -->
  <div class="sky" aria-hidden="true">
    <div class="sun"></div>
    <div class="cloud cloud--1"></div>
    <div class="cloud cloud--2"></div>
    <div class="cloud cloud--3"></div>
  </div>

  <!-- SCREEN 1: Login / API Key -->
  <main id="login-screen" class="screen">
    <div class="card">
      <div class="card__eyebrow">Step 1 of 3</div>
      <h1 class="card__title">Connect your key</h1>
      <p class="card__subtitle">
        Skyline reads the weather straight from <strong>OpenWeatherMap</strong>.
        Your key stays only in this browser — it never passes through any server of ours.
      </p>

      <form id="login-form" class="form" novalidate>
        <label for="api-key" class="form__label">Your API key</label>
        <input
          type="password"
          id="api-key"
          name="api-key"
          class="form__input"
          placeholder="e.g. 8f3a1c9d2e7b4f6a1c9d2e7b4f6a1c9d"
          autocomplete="off"
        >
        <button type="button" id="toggle-visibility" class="form__toggle" aria-label="Show key">👁</button>

        <p id="form-error" class="form__error" role="alert"></p>

        <button type="submit" class="btn btn--primary">Continue</button>

        <a
          href="https://home.openweathermap.org/users/sign_up"
          target="_blank"
          rel="noopener noreferrer"
          class="form__hint-link"
        >
          Don't have a key? Create one for free →
        </a>
      </form>
    </div>
  </main>

  <!-- SCREEN 2: Main app -->
  <main id="app-screen" class="screen screen--hidden">
    <header class="app-header">
      <div class="app-header__brand">Skyline</div>
      <button id="logout-btn" class="btn btn--ghost">Change key</button>
    </header>

    <div id="app-container" class="app-container">

      <div class="search-card">
        <form id="search-form" class="search-form" novalidate>
          <div class="search-field">
            <label for="city-input" class="search-field__label">City</label>
            <input
              type="text"
              id="city-input"
              name="city"
              class="search-field__input"
              placeholder="e.g. London"
              autocomplete="off"
            >
          </div>

          <div class="search-field search-field--country">
            <label for="country-select" class="search-field__label">Country</label>
            <select id="country-select" name="country" class="search-field__select">
              <option value="">Any</option>
              <option value="RO">RO — Romania</option>
              <option value="US">US — USA</option>
              <option value="GB">GB — United Kingdom</option>
              <option value="FR">FR — France</option>
              <option value="DE">DE — Germany</option>
              <option value="IT">IT — Italy</option>
              <option value="ES">ES — Spain</option>
              <option value="NL">NL — Netherlands</option>
              <option value="MD">MD — Moldova</option>
              <option value="HU">HU — Hungary</option>
            </select>
          </div>

          <p id="search-error" class="search-form__error" role="alert"></p>

          <button type="submit" class="btn btn--search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <circle cx="11" cy="11" r="7"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            Search weather
          </button>
        </form>
      </div>

      <div id="results" class="results results--empty"></div>

    </div>
  </main>

<script>
// ============================================
// Skyline — Step 1: Login / API Key Authentication (BYOK)
// ============================================

const STORAGE_KEY = 'skyline_owm_api_key';

// DOM references
const loginScreen = document.getElementById('login-screen');
const appScreen = document.getElementById('app-screen');
const loginForm = document.getElementById('login-form');
const apiKeyInput = document.getElementById('api-key');
const formError = document.getElementById('form-error');
const toggleVisibilityBtn = document.getElementById('toggle-visibility');
const logoutBtn = document.getElementById('logout-btn');

/**
 * Switches which screen is visible.
 * @param {'login' | 'app'} screenName
 */
function showScreen(screenName) {
  if (screenName === 'app') {
    loginScreen.classList.add('screen--hidden');
    appScreen.classList.remove('screen--hidden');
  } else {
    appScreen.classList.add('screen--hidden');
    loginScreen.classList.remove('screen--hidden');
  }
}

/**
 * Shows an error under the input, without using alert().
 * @param {string} message
 */
function setError(message) {
  formError.textContent = message;
  apiKeyInput.classList.toggle('is-invalid', Boolean(message));
}

/**
 * Checks whether a key is already saved in localStorage
 * and decides which screen to show when the page loads.
 */
function checkExistingKey() {
  const savedKey = localStorage.getItem(STORAGE_KEY);
  if (savedKey) {
    showScreen('app');
  } else {
    showScreen('login');
  }
}

/**
 * Handler for the login form submit.
 */
function handleLoginSubmit(event) {
  event.preventDefault();

  const rawValue = apiKeyInput.value.trim();

  if (!rawValue) {
    setError('The API key cannot be empty.');
    apiKeyInput.focus();
    return;
  }

  // Minimal length check — OpenWeatherMap keys are usually 32 characters,
  // but we don't hard-enforce 32 so we don't reject valid keys in other formats.
  if (rawValue.length < 10) {
    setError('The key looks too short. Check that you copied it in full.');
    apiKeyInput.focus();
    return;
  }

  setError('');
  localStorage.setItem(STORAGE_KEY, rawValue);
  apiKeyInput.value = '';
  showScreen('app');
}

/**
 * Handler for the logout / change-key button.
 */
function handleLogout() {
  localStorage.removeItem(STORAGE_KEY);
  showScreen('login');
}

/**
 * Toggles the input's text visibility (password <-> text).
 */
function handleToggleVisibility() {
  const isPassword = apiKeyInput.type === 'password';
  apiKeyInput.type = isPassword ? 'text' : 'password';
  toggleVisibilityBtn.textContent = isPassword ? '🙈' : '👁';
  toggleVisibilityBtn.setAttribute(
    'aria-label',
    isPassword ? 'Hide key' : 'Show key'
  );
}

// Event listeners
loginForm.addEventListener('submit', handleLoginSubmit);
logoutBtn.addEventListener('click', handleLogout);
toggleVisibilityBtn.addEventListener('click', handleToggleVisibility);
apiKeyInput.addEventListener('input', () => setError(''));

// Initialize on page load
checkExistingKey();


// ============================================
// Skyline — Step 2: Search Form (City + Country)
// ============================================

const searchForm = document.getElementById('search-form');
const cityInput = document.getElementById('city-input');
const countrySelect = document.getElementById('country-select');
const searchError = document.getElementById('search-error');
const resultsContainer = document.getElementById('results');
const searchSubmitBtn = searchForm.querySelector('button[type="submit"]');

const WEATHER_API_BASE = 'https://api.openweathermap.org/data/2.5/weather';

/**
 * Shows / hides the error under the search form.
 * @param {string} message
 */
function setSearchError(message) {
  searchError.textContent = message;
  cityInput.classList.toggle('is-invalid', Boolean(message));
}

/**
 * Shows the "loading" state in the results container.
 */
function showLoadingState() {
  resultsContainer.classList.remove('results--empty');
  resultsContainer.innerHTML = `
    <div class="loading-state">
      <div class="spinner" role="status" aria-label="Loading"></div>
      <span>Loading weather…</span>
    </div>
  `;
}

/**
 * Shows an error message in the results container.
 * @param {string} message
 * @param {boolean} showKeyAction - whether to add a "Change key" button (for 401)
 */
function showResultError(message, showKeyAction = false) {
  resultsContainer.classList.remove('results--empty');
  resultsContainer.innerHTML = `
    <div class="result-error">
      <div class="result-error__icon">⚠️</div>
      <p class="result-error__message">${message}</p>
      ${showKeyAction ? '<button type="button" id="fix-key-btn" class="btn btn--ghost result-error__action">Re-enter API key</button>' : ''}
    </div>
  `;

  if (showKeyAction) {
    document.getElementById('fix-key-btn').addEventListener('click', () => {
      localStorage.removeItem(STORAGE_KEY);
      showScreen('login');
    });
  }
}

/**
 * Converts wind direction from degrees to an approximate cardinal point.
 * @param {number} deg
 */
function degToCompass(deg) {
  const directions = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
  return directions[Math.round(deg / 45) % 8];
}

/**
 * Renders the weather card from the OpenWeatherMap response.
 * @param {object} data
 */
function renderWeatherCard(data) {
  const cityName = data.name || '—';
  const countryCode = data.sys?.country || '';
  const temp = Math.round(data.main?.temp);
  const feelsLike = Math.round(data.main?.feels_like);
  const description = data.weather?.[0]?.description || '';
  const iconCode = data.weather?.[0]?.icon || '01d';
  const humidity = data.main?.humidity;
  const pressure = data.main?.pressure;
  const windSpeedKmh = data.wind?.speed != null ? Math.round(data.wind.speed * 3.6) : null;
  const windDeg = data.wind?.deg;

  resultsContainer.classList.remove('results--empty');
  resultsContainer.innerHTML = `
    <div class="weather-card">
      <p class="weather-card__location">${cityName}${countryCode ? ', ' + countryCode : ''}</p>
      <div class="weather-card__main">
        <div class="weather-card__temp-block">
          <span class="weather-card__temp">${temp}°C</span>
          <span class="weather-card__desc">${description}</span>
        </div>
        <img
          class="weather-card__icon"
          src="https://openweathermap.org/img/wn/${iconCode}@2x.png"
          alt="${description}"
        >
      </div>
      <div class="weather-card__grid">
        <div class="weather-stat">
          <div class="weather-stat__label">Feels like</div>
          <div class="weather-stat__value"><strong>${feelsLike}°C</strong></div>
        </div>
        <div class="weather-stat">
          <div class="weather-stat__label">Humidity</div>
          <div class="weather-stat__value"><strong>${humidity ?? '—'}%</strong></div>
        </div>
        <div class="weather-stat">
          <div class="weather-stat__label">Wind</div>
          <div class="weather-stat__value">
            <strong>${windSpeedKmh ?? '—'} km/h</strong>${windDeg != null ? ' ' + degToCompass(windDeg) : ''}
          </div>
        </div>
        <div class="weather-stat">
          <div class="weather-stat__label">Pressure</div>
          <div class="weather-stat__value"><strong>${pressure ?? '—'}</strong> hPa</div>
        </div>
      </div>
    </div>
  `;
}

/**
 * Calls the OpenWeatherMap Current Weather Data API.
 * @param {string} city
 * @param {string} country - 2-letter ISO code, or empty string
 */
async function fetchWeather(city, country) {
  const apiKey = localStorage.getItem(STORAGE_KEY);
  const query = country ? `${city},${country}` : city;
  const url = `${WEATHER_API_BASE}?q=${encodeURIComponent(query)}&units=metric&lang=en&appid=${apiKey}`;

  let response;
  try {
    response = await fetch(url);
  } catch (networkErr) {
    showResultError("Couldn't connect. Check your internet connection and try again.");
    return;
  }

  let payload;
  try {
    payload = await response.json();
  } catch (parseErr) {
    showResultError('The response from the server was unexpected. Try again.');
    return;
  }

  if (response.status === 401) {
    showResultError('The API key looks invalid or has expired.', true);
    return;
  }

  if (response.status === 404) {
    showResultError('City not found. Check what you entered.');
    return;
  }

  if (!response.ok) {
    showResultError(`An unexpected error occurred (${response.status}). Try again.`);
    return;
  }

  renderWeatherCard(payload);
}

/**
 * Handler for the search form submit.
 */
async function handleSearchSubmit(event) {
  event.preventDefault();

  const city = cityInput.value.trim();
  const country = countrySelect.value;

  if (!city) {
    setSearchError('Enter a city to search the weather.');
    cityInput.focus();
    return;
  }

  setSearchError('');
  showLoadingState();

  searchSubmitBtn.disabled = true;
  try {
    await fetchWeather(city, country);
  } finally {
    searchSubmitBtn.disabled = false;
  }
}

searchForm.addEventListener('submit', handleSearchSubmit);
cityInput.addEventListener('input', () => setSearchError(''));
</script>
